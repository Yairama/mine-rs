[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "miners"
version = "0.1.0"
description = "Python SDK base para mine-rs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mine-rs contributors" }]
dependencies = ["numpy>=2.3", "pandas>=2.2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/mine-python/Cargo.toml"
module-name = "miners._native"
python-source = "python"
