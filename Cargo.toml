[workspace]
members = [
    "crates/mine-core",
    "crates/mine-blockmodel",
    "crates/mine-economics",
    "crates/mine-indexing",
    "crates/mine-io",
    "crates/mine-planning",
    "crates/mine-validation",
    "crates/mine-sdk",
    "crates/mine-tools",
    "crates/mine-python",

    "crates/mine-reblock",
    "examples/marvin-inspect",
    "examples/marvin-benchmark",
    "examples/marvin-prec",
    "examples/marvin-planning",
    "examples/stochastic-planning",
]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
rayon = "1"
arrow = "56"
parquet = "56"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
pyo3 = "0.24"
criterion = "0.5"
csv = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
